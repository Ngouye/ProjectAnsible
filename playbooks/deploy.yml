---
# Étape 4 — Déploiement progressif : un serveur à la fois, l'exécution s'arrête au premier
# échec (le serveur en échec est déjà revenu en arrière), les autres continuent de servir.
- name: Deploy application (rolling update)
  hosts: role_web
  become: true
  serial: "{{ deploy_batch_size | default(1) }}"
  max_fail_percentage: 0
  roles:
    - role: app_deploy
      tags: [deploy]
