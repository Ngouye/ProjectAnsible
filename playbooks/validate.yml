---
# Étape 5 — Validation de conformité : chaque contrôle est vérifié sur chaque serveur,
# un rapport JSON par serveur + un rapport Markdown consolidé sont écrits dans reports/
- name: Validate configuration compliance
  hosts: role_web
  become: true
  roles:
    - role: validation
      tags: [validate]

- name: Publish consolidated compliance report
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [validate]
  tasks:
    - name: Render Markdown report
      ansible.builtin.include_role:
        name: validation
        tasks_from: report
      vars:
        validation_report_hosts: "{{ groups['role_web'] | default([]) }}"
