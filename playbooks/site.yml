---
# Pipeline complet : provision -> harden -> monitoring -> deploy -> validate
#   ansible-playbook playbooks/site.yml
#   ansible-playbook playbooks/site.yml --tags hardening      (une seule couche)
#   ansible-playbook playbooks/site.yml --check --diff        (détection de dérive)
- name: Provision
  ansible.builtin.import_playbook: provision.yml

- name: Harden
  ansible.builtin.import_playbook: harden.yml

- name: Monitoring
  ansible.builtin.import_playbook: monitoring.yml

- name: Deploy
  ansible.builtin.import_playbook: deploy.yml

- name: Validate
  ansible.builtin.import_playbook: validate.yml
