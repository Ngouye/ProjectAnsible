[defaults]
inventory = inventories/dev/aws_ec2.yml
roles_path = roles
collections_path = collections:~/.ansible/collections
interpreter_python = auto_silent
forks = 20
timeout = 30
retry_files_enabled = False
host_key_checking = True
callback_result_format = yaml
callbacks_enabled = ansible.posix.profile_tasks, ansible.posix.timer
gathering = smart
fact_caching = jsonfile
fact_caching_connection = .cache/facts
fact_caching_timeout = 3600
# Never display secrets in logs, even in verbose mode
display_args_to_stdout = False

[inventory]
enable_plugins = amazon.aws.aws_ec2, host_list, yaml, ini, auto
cache = True
cache_plugin = jsonfile
cache_connection = .cache/inventory
cache_timeout = 300

[privilege_escalation]
become = False
become_method = sudo

[ssh_connection]
pipelining = True
# accept-new: trust a freshly provisioned instance once, reject any later host key change
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30
