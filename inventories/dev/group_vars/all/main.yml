---
# ---------------------------------------------------------------------------
# Environnement : dev
# ---------------------------------------------------------------------------
project_name: ansible-aws-automation
env_name: dev
aws_region: eu-west-3

ansible_ssh_private_key_file: "~/.ssh/{{ project_name }}"

# --- Infrastructure AWS (rôle aws_infra) ------------------------------------
aws_infra_vpc_cidr: 10.10.0.0/16
aws_infra_public_subnets:
  - cidr: 10.10.1.0/24
    az_suffix: a
  - cidr: 10.10.2.0/24
    az_suffix: b
aws_infra_os: ubuntu # ubuntu | amazonlinux
aws_infra_instance_type: t3.micro
aws_infra_web_instance_count: 2
aws_infra_ssh_public_key_path: "~/.ssh/{{ project_name }}.pub"
# IP publique(s) autorisée(s) en SSH — REMPLACER par la vôtre (curl ifconfig.me)/32
aws_infra_admin_cidrs:
  - 203.0.113.10/32

# Accès SSH temporaire du runner CI, ajouté au Security Group par le
# pipeline (-e) pour que le provisionnement ne le supprime pas pendant l'exécution
ci_runner_cidrs: []

# --- Durcissement ----------------------------------------------------------------
hardening_monitoring_cidrs:
  - "{{ aws_infra_vpc_cidr }}"

# --- Supervision ---------------------------------------------------------------
monitoring_cloudwatch_enabled: true
monitoring_alarm_sns_topic_arn: ""

# --- Application --------------------------------------------------------------
app_deploy_env: "{{ env_name }}"
app_deploy_server_name: "_"
# Le secret est lu dans Ansible Vault s'il existe, sinon dans
# AWS SSM Parameter Store (SecureString chiffré par KMS).
app_deploy_secret_key: >-
  {{ vault_app_secret_key if vault_app_secret_key is defined
     else lookup('amazon.aws.ssm_parameter', '/' ~ project_name ~ '/' ~ env_name ~ '/app_secret_key', region=aws_region) }}
