---
# Test d'intégration de toute la pile serveur (common -> hardening -> monitoring
# -> app_deploy), vérifiée par le même rôle de conformité qu'en production.
dependency:
  name: galaxy
  enabled: false # les collections sont installées par le job CI / le Makefile

driver:
  name: docker

platforms:
  - name: ubuntu2404
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    groups:
      - role_web

  - name: rockylinux9
    image: geerlingguy/docker-rockylinux9-ansible:latest
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    groups:
      - role_web

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/roles"
  config_options:
    defaults:
      callbacks_enabled: ansible.posix.profile_tasks
  inventory:
    group_vars:
      all:
        # Pas d'AWS en CI : l'agent CloudWatch n'est pas installé
        monitoring_cloudwatch_enabled: false
        app_deploy_secret_key: molecule-only-secret-key-0123456789abcdef # gitleaks:allow (valeur de test)

verifier:
  name: ansible

scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - converge
    - idempotence
    - verify
    - destroy
