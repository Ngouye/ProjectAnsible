---
name: Setup Ansible toolchain
description: Python, Ansible, linters and collections (with caching)

inputs:
  extra-packages:
    description: Additional pip requirement specifiers
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip

    - name: Install Python dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt ${{ inputs.extra-packages }}

    - name: Cache Ansible collections
      uses: actions/cache@v4
      with:
        path: collections
        key: collections-${{ hashFiles('requirements.yml') }}

    - name: Install Ansible collections
      shell: bash
      run: ansible-galaxy collection install -r requirements.yml -p collections
