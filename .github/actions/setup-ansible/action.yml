---
name: Setup Ansible toolchain
description: Python, Ansible, linters and collections (with caching)

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"
        cache: pip

    - name: Install Python dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Cache Ansible collections
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: collections
        key: collections-${{ hashFiles('requirements.yml') }}

    - name: Install Ansible collections
      shell: bash
      run: ansible-galaxy collection install -r requirements.yml -p collections
