---
name: CI

# Sur main, ce workflow s'exécute comme quality gate de deploy.yml (workflow_call)
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

# Moindre privilège : jeton en lecture seule par défaut
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & syntax
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-ansible

      - name: yamllint
        run: yamllint --strict .

      - name: ansible-lint (production profile)
        run: ansible-lint --profile production

      - name: Syntax check of every playbook
        run: |
          for playbook in playbooks/*.yml; do
            echo "::group::${playbook}"
            ansible-playbook -i localhost, --syntax-check "${playbook}"
            echo "::endgroup::"
          done

  secrets-scan:
    name: Secrets scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read # gitleaks liste les commits d'une pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  molecule:
    name: Molecule (Ubuntu 24.04 + Rocky 9)
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-ansible

      - name: Converge, idempotence and compliance verification
        run: molecule test
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
