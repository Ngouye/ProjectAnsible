---
name: Drift detection

# Chaque nuit : rejoue le durcissement en mode --check. Toute tâche « changed »
# signifie qu'un serveur a été modifié à la main -> le workflow échoue.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [dev, prod]
        default: prod

permissions: {}

env:
  TARGET_ENV: ${{ inputs.environment || 'prod' }}
  AWS_REGION: eu-west-3

jobs:
  drift:
    if: github.event_name == 'workflow_dispatch' || vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    environment: ${{ inputs.environment || 'prod' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-ansible

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-drift-${{ github.run_id }}

      - name: Install SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/ansible-aws-automation
          chmod 600 ~/.ssh/ansible-aws-automation

      - name: Open SSH for this runner only
        id: ssh
        uses: ./.github/actions/ci-ssh-access
        with:
          action: open
          environment: ${{ env.TARGET_ENV }}

      - name: Check configuration drift
        run: |
          set -o pipefail
          ansible-playbook playbooks/harden.yml playbooks/monitoring.yml --check --diff \
            -i "inventories/${TARGET_ENV}/aws_ec2.yml" | tee drift.log
          if grep -E 'changed=[1-9]' drift.log; then
            echo "::error::Configuration drift detected - see the diff above"
            exit 1
          fi

      - name: Run compliance checks
        run: ansible-playbook playbooks/validate.yml -i "inventories/${TARGET_ENV}/aws_ec2.yml"

      - name: Close SSH for this runner
        if: always() && steps.ssh.outcome == 'success'
        uses: ./.github/actions/ci-ssh-access
        with:
          action: close
          environment: ${{ env.TARGET_ENV }}

      - name: Remove SSH key from the runner
        if: always()
        run: rm -f ~/.ssh/ansible-aws-automation

      - name: Publish compliance report
        if: always()
        run: |
          if [ -f reports/compliance-report.md ]; then
            cat reports/compliance-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
