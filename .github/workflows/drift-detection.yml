---
name: Drift detection

# Every night: re-applies the hardening baseline in --check mode. Any "changed"
# task means someone modified a server by hand -> the workflow fails.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [dev, prod]
        default: prod

permissions:
  contents: read
  id-token: write

env:
  TARGET_ENV: ${{ inputs.environment || 'prod' }}
  AWS_REGION: eu-west-3

jobs:
  drift:
    if: github.event_name == 'workflow_dispatch' || vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment || 'prod' }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-ansible

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-drift-${{ github.run_id }}

      - name: Install SSH key
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/ansible-aws-automation
          chmod 600 ~/.ssh/ansible-aws-automation

      - name: Open SSH for this runner only
        id: ssh
        uses: ./.github/actions/ci-ssh-access
        with:
          action: open
          environment: ${{ env.TARGET_ENV }}

      - name: Check configuration drift
        run: |
          set -o pipefail
          ansible-playbook playbooks/harden.yml playbooks/monitoring.yml --check --diff \
            -i "inventories/${TARGET_ENV}/aws_ec2.yml" | tee drift.log
          if grep -E 'changed=[1-9]' drift.log; then
            echo "::error::Configuration drift detected - see the diff above"
            exit 1
          fi

      - name: Run compliance checks
        run: ansible-playbook playbooks/validate.yml -i "inventories/${TARGET_ENV}/aws_ec2.yml"

      - name: Close SSH for this runner
        if: always() && steps.ssh.outcome == 'success'
        uses: ./.github/actions/ci-ssh-access
        with:
          action: close
          environment: ${{ env.TARGET_ENV }}

      - name: Publish compliance report
        if: always()
        run: |
          if [ -f reports/compliance-report.md ]; then
            cat reports/compliance-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
