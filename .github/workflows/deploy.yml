---
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, prod]
        default: dev
      playbook:
        description: Playbook to run
        type: choice
        options: [site, deploy, harden, monitoring, validate]
        default: site

# Moindre privilège : aucun droit par défaut, chaque job demande ce dont il a besoin
permissions: {}

env:
  TARGET_ENV: ${{ inputs.environment || 'dev' }}
  PLAYBOOK: ${{ inputs.playbook || 'site' }}
  AWS_REGION: eu-west-3

jobs:
  ci:
    name: Quality gate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read

  deploy:
    name: Deploy to ${{ inputs.environment || 'dev' }}
    needs: ci
    # Déploiement automatique sur push seulement quand AWS est configuré (variable de dépôt DEPLOY_ENABLED=true)
    if: github.event_name == 'workflow_dispatch' || vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # OIDC : identifiants AWS temporaires, aucune clé d'accès stockée dans GitHub
    # Environnement GitHub : « prod » exige une approbation manuelle (règle de protection)
    environment: ${{ inputs.environment || 'dev' }}
    concurrency:
      group: deploy-${{ inputs.environment || 'dev' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-ansible

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-deploy-${{ github.run_id }}

      - name: Install SSH deploy key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/ansible-aws-automation
          chmod 600 ~/.ssh/ansible-aws-automation
          ssh-keygen -y -f ~/.ssh/ansible-aws-automation > ~/.ssh/ansible-aws-automation.pub

      - name: Open SSH for this runner only
        id: ssh
        uses: ./.github/actions/ci-ssh-access
        with:
          action: open
          environment: ${{ env.TARGET_ENV }}

      - name: Run playbook
        env:
          RUNNER_CIDR: ${{ steps.ssh.outputs.cidr }}
        run: |
          ansible-playbook "playbooks/${PLAYBOOK}.yml" \
            -i "inventories/${TARGET_ENV}/aws_ec2.yml" \
            -e "{\"ci_runner_cidrs\": [\"${RUNNER_CIDR}\"]}" \
            -e "app_deploy_version=${GITHUB_SHA::7}"

      # Toujours exécuté, même si le déploiement a échoué
      - name: Close SSH for this runner
        if: always() && steps.ssh.outcome == 'success'
        uses: ./.github/actions/ci-ssh-access
        with:
          action: close
          environment: ${{ env.TARGET_ENV }}

      - name: Remove SSH key from the runner
        if: always()
        run: rm -f ~/.ssh/ansible-aws-automation ~/.ssh/ansible-aws-automation.pub

      - name: Publish compliance report
        if: always()
        run: |
          if [ -f reports/compliance-report.md ]; then
            cat reports/compliance-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compliance-${{ env.TARGET_ENV }}-${{ github.run_number }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 30
