---
- name: Restart application
  ansible.builtin.systemd_service:
    name: "{{ app_deploy_name }}"
    state: restarted
    daemon_reload: true

# Both handlers listen to "Reload nginx": the configuration is validated
# first, and nginx is reloaded only if "nginx -t" succeeds.
- name: Validate nginx configuration
  ansible.builtin.command:
    cmd: nginx -t
  changed_when: false
  listen: Reload nginx

- name: Reload nginx service
  ansible.builtin.systemd_service:
    name: nginx
    state: reloaded
  listen: Reload nginx
