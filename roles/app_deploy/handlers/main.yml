---
- name: Restart application
  ansible.builtin.systemd_service:
    name: "{{ app_deploy_name }}"
    state: restarted
    daemon_reload: true

# Les deux handlers écoutent « Reload nginx » : la configuration est d'abord
# validée, et nginx n'est rechargé que si « nginx -t » réussit.
- name: Validate nginx configuration
  ansible.builtin.command:
    cmd: nginx -t
  changed_when: false
  listen: Reload nginx

- name: Reload nginx service
  ansible.builtin.systemd_service:
    name: nginx
    state: reloaded
  listen: Reload nginx
