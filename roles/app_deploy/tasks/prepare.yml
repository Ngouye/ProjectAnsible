---
- name: Install application runtime and web server
  ansible.builtin.package:
    name: "{{ app_deploy_packages }}"
    state: present

# Dedicated unprivileged account: no shell, no home, cannot modify its own code
- name: Create application system user
  ansible.builtin.user:
    name: "{{ app_deploy_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ app_deploy_base_dir }}"
    create_home: false
    state: present

- name: Create application directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ app_deploy_base_dir }}", group: root, mode: "0755" }
    - { path: "{{ app_deploy_base_dir }}/releases", group: root, mode: "0755" }
    - { path: "/etc/{{ app_deploy_name }}", group: "{{ app_deploy_user }}", mode: "0750" }

- name: Allow nginx to proxy to the application (SELinux)
  ansible.posix.seboolean:
    name: httpd_can_network_connect
    state: true
    persistent: true
  when: ansible_facts['selinux']['status'] | default('disabled') == 'enabled'
