---
# Releases immuables :  /opt/app/releases/<version>/  +  /opt/app/current -> lien symbolique
# Le changement de version est atomique ; le rollback consiste à repointer le lien.
- name: Inspect current release
  ansible.builtin.stat:
    path: "{{ app_deploy_base_dir }}/current"
  register: app_deploy_current

- name: Remember previous release for rollback
  ansible.builtin.set_fact:
    app_deploy_previous_release: "{{ app_deploy_current.stat.lnk_source | default('') }}"

- name: Deploy release with automatic rollback
  block:
    - name: Create release directory
      ansible.builtin.file:
        path: "{{ app_deploy_release_dir }}"
        state: directory
        owner: root
        group: "{{ app_deploy_user }}"
        mode: "0750"

    # Le code appartient à root et n'est lisible que par le groupe app : un processus
    # compromis ne peut pas réécrire son propre code.
    - name: Copy application code
      ansible.builtin.copy:
        src: app/
        dest: "{{ app_deploy_release_dir }}/"
        owner: root
        group: "{{ app_deploy_user }}"
        mode: "0640"
        directory_mode: "0750"

    - name: Stamp release version
      ansible.builtin.copy:
        content: "{{ app_deploy_version }}\n"
        dest: "{{ app_deploy_release_dir }}/VERSION"
        owner: root
        group: "{{ app_deploy_user }}"
        mode: "0640"

    - name: Install Python dependencies in an isolated virtualenv
      ansible.builtin.pip:
        requirements: "{{ app_deploy_release_dir }}/requirements.txt"
        virtualenv: "{{ app_deploy_release_dir }}/venv"
        virtualenv_command: "{{ app_deploy_python }} -m venv"
        umask: "0022"

    - name: Write application environment file (secrets)
      ansible.builtin.template:
        src: app.env.j2
        dest: "/etc/{{ app_deploy_name }}/{{ app_deploy_name }}.env"
        owner: root
        group: "{{ app_deploy_user }}"
        mode: "0640"
      no_log: true
      diff: false
      notify: Restart application

    - name: Deploy sandboxed systemd unit
      ansible.builtin.template:
        src: app.service.j2
        dest: "/etc/systemd/system/{{ app_deploy_name }}.service"
        owner: root
        group: root
        mode: "0644"
      notify: Restart application

    - name: Switch current release
      ansible.builtin.file:
        src: "{{ app_deploy_release_dir }}"
        dest: "{{ app_deploy_base_dir }}/current"
        state: link
        force: true
      notify: Restart application

    - name: Enable application service
      ansible.builtin.systemd_service:
        name: "{{ app_deploy_name }}"
        enabled: true
        state: started
        daemon_reload: true

    - name: Apply pending restarts before health checks
      ansible.builtin.meta: flush_handlers

    - name: Wait for the new version to be healthy
      ansible.builtin.uri:
        url: "http://{{ app_deploy_bind }}/health"
        return_content: true
      register: app_deploy_health
      until:
        - app_deploy_health.status == 200
        - app_deploy_health.json.version == app_deploy_version | string
      retries: "{{ app_deploy_healthcheck_retries }}"
      delay: "{{ app_deploy_healthcheck_delay }}"

    - name: Check the application end-to-end through nginx (HTTPS)
      ansible.builtin.uri:
        url: https://127.0.0.1/health
        validate_certs: false
      register: app_deploy_health_tls
      until: app_deploy_health_tls.status == 200
      retries: "{{ app_deploy_healthcheck_retries }}"
      delay: "{{ app_deploy_healthcheck_delay }}"

  rescue:
    - name: Roll back to the previous release
      ansible.builtin.file:
        src: "{{ app_deploy_previous_release }}"
        dest: "{{ app_deploy_base_dir }}/current"
        state: link
        force: true
      when:
        - app_deploy_previous_release | length > 0
        - app_deploy_previous_release != app_deploy_release_dir

    - name: Restart application on the previous release
      ansible.builtin.systemd_service:
        name: "{{ app_deploy_name }}"
        state: restarted
      when:
        - app_deploy_previous_release | length > 0
        - app_deploy_previous_release != app_deploy_release_dir

    - name: Abort the deployment
      ansible.builtin.fail:
        msg: >-
          Release {{ app_deploy_version }} failed its health check on {{ inventory_hostname }}.
          Rolled back to: {{ app_deploy_previous_release | default('nothing', true) }}.

- name: List installed releases
  ansible.builtin.find:
    paths: "{{ app_deploy_base_dir }}/releases"
    file_type: directory
  register: app_deploy_releases

- name: Remove old releases
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: >-
    {{ (app_deploy_releases.files | sort(attribute='mtime') | map(attribute='path') | list)[:-(app_deploy_keep_releases | int)]
       | reject('equalto', app_deploy_release_dir) | reject('equalto', app_deploy_previous_release) | list }}
