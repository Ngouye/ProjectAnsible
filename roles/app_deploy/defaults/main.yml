---
app_deploy_name: demo-app
# Overridden by the pipeline with the git commit SHA (-e app_deploy_version=...)
app_deploy_version: "1.0.0"
app_deploy_env: dev

app_deploy_user: app
app_deploy_base_dir: /opt/app
app_deploy_release_dir: "{{ app_deploy_base_dir }}/releases/{{ app_deploy_version }}"
app_deploy_keep_releases: 3

app_deploy_bind: 127.0.0.1:8000
app_deploy_workers: 2

# Required, min. 32 characters — from Ansible Vault or AWS SSM Parameter Store
app_deploy_secret_key: ""

# --- nginx / TLS ----------------------------------------------------------------
app_deploy_server_name: "_"
app_deploy_tls_dir: /etc/nginx/tls
app_deploy_tls_days: 365
app_deploy_rate_limit: 10r/s
app_deploy_listen_ipv6: "{{ ansible_facts['all_ipv6_addresses'] | default([]) | length > 0 }}"

# --- Health check -------------------------------------------------------------
app_deploy_healthcheck_retries: 10
app_deploy_healthcheck_delay: 3
