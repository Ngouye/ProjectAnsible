---
- name: Apply kernel hardening parameters
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-hardening.conf
    sysctl_set: true
    reload: true
    state: present
  loop: "{{ hardening_sysctl | dict2items }}"
  loop_control:
    label: "{{ item.key }} = {{ item.value }}"
  when: not hardening_is_container

- name: Disable unused filesystems and network protocols
  ansible.builtin.template:
    src: modprobe-hardening.conf.j2
    dest: /etc/modprobe.d/hardening.conf
    owner: root
    group: root
    mode: "0644"
