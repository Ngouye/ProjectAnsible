---
# Les contrôles de niveau noyau (sysctl, auditd, pare-feu) ne peuvent pas s'appliquer dans un
# conteneur : ils sont ignorés pendant les tests Molecule et pleinement appliqués sur EC2.
hardening_is_container: "{{ ansible_facts['virtualization_type'] | default('') in ['docker', 'container', 'containerd', 'podman', 'lxc'] }}"
