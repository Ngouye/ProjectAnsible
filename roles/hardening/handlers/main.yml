---
- name: Restart sshd
  ansible.builtin.systemd_service:
    name: "{{ hardening_sshd_service }}"
    state: restarted
  when: not hardening_is_container

- name: Reload nftables
  # reload ne réapplique que notre table ; restart viderait toutes les tables (fail2ban compris)
  ansible.builtin.systemd_service:
    name: nftables
    state: reloaded

- name: Load audit rules
  ansible.builtin.command:
    cmd: /usr/sbin/augenrules --load
  register: hardening_augenrules
  changed_when: true
  # En mode immuable (-e 2), les nouvelles règles ne s'appliquent qu'après redémarrage : pas une erreur
  failed_when:
    - hardening_augenrules.rc != 0
    - "'immutable' not in (hardening_augenrules.stdout ~ hardening_augenrules.stderr)"
  when: not hardening_is_container

- name: Reload auditd configuration
  # auditd refuse « systemctl restart » sur RHEL ; SIGHUP recharge auditd.conf partout
  ansible.builtin.command:
    cmd: pkill -HUP -x auditd
  changed_when: true
  when: not hardening_is_container

- name: Restart fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    state: restarted
  when: not hardening_is_container

- name: Restart journald
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted
  when: not hardening_is_container
