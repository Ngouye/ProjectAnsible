---
monitoring_arch_map:
  x86_64: amd64
  aarch64: arm64
monitoring_arch: "{{ monitoring_arch_map[ansible_facts['architecture']] }}"

monitoring_node_exporter_release: "node_exporter-{{ monitoring_node_exporter_version }}.linux-{{ monitoring_arch }}"
monitoring_node_exporter_url: >-
  https://github.com/prometheus/node_exporter/releases/download/v{{ monitoring_node_exporter_version }}/{{ monitoring_node_exporter_release }}.tar.gz
monitoring_node_exporter_checksum_url: >-
  https://github.com/prometheus/node_exporter/releases/download/v{{ monitoring_node_exporter_version }}/sha256sums.txt

monitoring_cloudwatch_download_dir: /opt/aws/packages
monitoring_cloudwatch_config_path: /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json
monitoring_cloudwatch_ctl: /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl
