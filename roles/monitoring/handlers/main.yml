---
- name: Restart node_exporter
  ansible.builtin.systemd_service:
    name: node_exporter
    state: restarted
    daemon_reload: true

- name: Reload CloudWatch agent
  ansible.builtin.command:
    cmd: "{{ monitoring_cloudwatch_ctl }} -a fetch-config -m ec2 -s -c file:{{ monitoring_cloudwatch_config_path }}"
  changed_when: true
