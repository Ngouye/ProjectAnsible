---
# Nommage / tags
aws_infra_name_prefix: "{{ project_name }}-{{ env_name }}"
aws_infra_tags:
  Project: "{{ project_name }}"
  Environment: "{{ env_name }}"
  ManagedBy: ansible
  Owner: platform-team

# Réseau
aws_infra_vpc_cidr: 10.10.0.0/16
aws_infra_public_subnets:
  - cidr: 10.10.1.0/24
    az_suffix: a
  - cidr: 10.10.2.0/24
    az_suffix: b

# Réseaux d'administration autorisés en SSH (0.0.0.0/0 est refusé par le rôle)
aws_infra_admin_cidrs: []
# Accès SSH temporaire (ex. : IP du runner GitHub Actions, ouvert puis refermé par le pipeline)
aws_infra_extra_ssh_cidrs: "{{ ci_runner_cidrs | default([]) }}"
# Réseaux autorisés à interroger node_exporter (Prometheus)
aws_infra_monitoring_cidrs:
  - "{{ aws_infra_vpc_cidr }}"

# Calcul (instances EC2)
aws_infra_os: ubuntu
aws_infra_architecture: x86_64
aws_infra_instance_type: t3.micro
aws_infra_web_instance_count: 2
aws_infra_root_volume_size: 20
aws_infra_termination_protection: false
aws_infra_detailed_monitoring: false

# Paire de clés SSH (clé publique envoyée à AWS, clé privée sur le poste / dans un secret CI)
aws_infra_ssh_key_name: "{{ aws_infra_name_prefix }}"
aws_infra_ssh_public_key_path: "~/.ssh/{{ project_name }}.pub"

# Catalogue d'AMI : toujours la dernière image officielle, recherchée à l'exécution
aws_infra_ami_catalog:
  ubuntu:
    owner: "099720109477" # Canonical
    name: "ubuntu/images/hvm-ssd-gp3/ubuntu-noble-24.04-{{ 'amd64' if aws_infra_architecture == 'x86_64' else 'arm64' }}-server-*"
  amazonlinux:
    owner: amazon
    name: "al2023-ami-2023.*-{{ aws_infra_architecture }}"

# Rôle IAM d'instance à privilèges minimaux : agent CloudWatch + SSM Session Manager
aws_infra_iam_managed_policies:
  - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
  - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

aws_infra_ssh_wait_timeout: 300
