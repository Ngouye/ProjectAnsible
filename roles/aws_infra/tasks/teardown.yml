---
# Destruction ordonnée de tout ce que crée le rôle (ordre inverse des dépendances)
- name: Terminate project instances
  amazon.aws.ec2_instance:
    region: "{{ aws_region }}"
    filters:
      "tag:Project": "{{ project_name }}"
      "tag:Environment": "{{ env_name }}"
      instance-state-name: [pending, running, stopping, stopped]
    wait: true
    state: absent

- name: Find project VPC
  amazon.aws.ec2_vpc_net_info:
    region: "{{ aws_region }}"
    filters:
      "tag:Name": "{{ aws_infra_name_prefix }}-vpc"
  register: aws_infra_vpc_info

- name: Delete network resources
  when: aws_infra_vpc_info.vpcs | length > 0
  vars:
    aws_infra_vpc_id: "{{ aws_infra_vpc_info.vpcs[0].vpc_id }}"
  block:
    - name: Delete security group
      amazon.aws.ec2_security_group:
        name: "{{ aws_infra_name_prefix }}-web-sg"
        vpc_id: "{{ aws_infra_vpc_id }}"
        region: "{{ aws_region }}"
        state: absent

    - name: Find project route tables
      amazon.aws.ec2_vpc_route_table_info:
        region: "{{ aws_region }}"
        filters:
          vpc-id: "{{ aws_infra_vpc_id }}"
          "tag:Project": "{{ project_name }}"
      register: aws_infra_route_tables

    - name: Delete route tables
      amazon.aws.ec2_vpc_route_table:
        vpc_id: "{{ aws_infra_vpc_id }}"
        region: "{{ aws_region }}"
        route_table_id: "{{ item.route_table_id }}"
        lookup: id
        state: absent
      loop: "{{ aws_infra_route_tables.route_tables }}"
      loop_control:
        label: "{{ item.route_table_id }}"

    - name: Delete subnets
      amazon.aws.ec2_vpc_subnet:
        vpc_id: "{{ aws_infra_vpc_id }}"
        cidr: "{{ item.cidr }}"
        region: "{{ aws_region }}"
        state: absent
      loop: "{{ aws_infra_public_subnets }}"
      loop_control:
        label: "{{ item.cidr }}"

    - name: Delete Internet Gateway
      amazon.aws.ec2_vpc_igw:
        vpc_id: "{{ aws_infra_vpc_id }}"
        region: "{{ aws_region }}"
        state: absent

    - name: Delete VPC
      amazon.aws.ec2_vpc_net:
        name: "{{ aws_infra_name_prefix }}-vpc"
        cidr_block: "{{ aws_infra_vpc_cidr }}"
        region: "{{ aws_region }}"
        state: absent

- name: Delete SSH key pair
  amazon.aws.ec2_key:
    name: "{{ aws_infra_ssh_key_name }}"
    region: "{{ aws_region }}"
    state: absent

- name: Delete IAM role and instance profile
  amazon.aws.iam_role:
    name: "{{ aws_infra_name_prefix }}-ec2-role"
    delete_instance_profile: true
    state: absent
