---
- name: Create VPC
  amazon.aws.ec2_vpc_net:
    name: "{{ aws_infra_name_prefix }}-vpc"
    cidr_block: "{{ aws_infra_vpc_cidr }}"
    region: "{{ aws_region }}"
    dns_support: true
    dns_hostnames: true
    tags: "{{ aws_infra_tags }}"
    state: present
  register: aws_infra_vpc

- name: Create Internet Gateway
  amazon.aws.ec2_vpc_igw:
    vpc_id: "{{ aws_infra_vpc.vpc.id }}"
    region: "{{ aws_region }}"
    tags: "{{ aws_infra_tags | combine({'Name': aws_infra_name_prefix ~ '-igw'}) }}"
    state: present
  register: aws_infra_igw

- name: Create public subnets (one per availability zone)
  amazon.aws.ec2_vpc_subnet:
    vpc_id: "{{ aws_infra_vpc.vpc.id }}"
    cidr: "{{ item.cidr }}"
    az: "{{ aws_region }}{{ item.az_suffix }}"
    region: "{{ aws_region }}"
    map_public: true
    tags: "{{ aws_infra_tags | combine({'Name': aws_infra_name_prefix ~ '-public-' ~ item.az_suffix, 'Tier': 'public'}) }}"
    state: present
  loop: "{{ aws_infra_public_subnets }}"
  loop_control:
    label: "{{ item.cidr }}"
  register: aws_infra_subnets

- name: Store subnet identifiers
  ansible.builtin.set_fact:
    aws_infra_subnet_ids: "{{ aws_infra_subnets.results | map(attribute='subnet.id') | list }}"

- name: Create public route table
  amazon.aws.ec2_vpc_route_table:
    vpc_id: "{{ aws_infra_vpc.vpc.id }}"
    region: "{{ aws_region }}"
    subnets: "{{ aws_infra_subnet_ids }}"
    routes:
      - dest: 0.0.0.0/0
        gateway_id: "{{ aws_infra_igw.gateway_id }}"
    tags: "{{ aws_infra_tags | combine({'Name': aws_infra_name_prefix ~ '-public-rt'}) }}"
    state: present
