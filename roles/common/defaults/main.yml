---
common_timezone: Etc/UTC

common_packages:
  - ca-certificates
  - chrony
  - jq
  - openssh-server
  - python3
  - sudo
  - tar
  - unzip

# Amazon Time Sync Service (link-local, disponible dans chaque VPC)
common_aws_time_sync: true
common_aws_time_server: 169.254.169.123

# Seuls les membres de ce groupe peuvent ouvrir une session SSH (voir le rôle hardening)
common_ssh_group: sshusers

# Comptes admin nominatifs, clé SSH uniquement (mot de passe verrouillé)
# - name: alice
#   ssh_public_key: "ssh-ed25519 AAAA... alice@laptop"
#   state: present
common_admin_users: []
